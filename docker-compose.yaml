services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: fastapi-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./app/backend:/app
    env_file:
      - ./.env
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: react-frontend-dev
    ports:
      - "5173:5173" 
    volumes:
      - ./app/frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
